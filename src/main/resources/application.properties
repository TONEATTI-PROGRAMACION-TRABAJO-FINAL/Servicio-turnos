spring.application.name=servicio-turnos
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Errors are returned as application/problem+json (RFC 9457).
spring.mvc.problemdetails.enabled=true

# Integration with the cátedra service. Real values only through environment variables (see .env.example).
# The empty default makes a missing variable fail validation at startup instead of binding the literal placeholder.
catedra.api-base-url=${CATEDRA_API_BASE_URL:}
catedra.jwt=${CATEDRA_JWT:}
# The REST timeouts default to PT2S (connect) and PT5S (read); CATEDRA_CONNECT_TIMEOUT and CATEDRA_READ_TIMEOUT
# override them (ISO-8601 duration).
catedra.kafka.bootstrap-servers=${CATEDRA_KAFKA_BOOTSTRAP_SERVERS:}
catedra.kafka.consumer-group-id=${CATEDRA_KAFKA_CONSUMER_GROUP_ID:}
catedra.kafka.appointment-actions-topic=${CATEDRA_KAFKA_APPOINTMENT_ACTIONS_TOPIC:}
catedra.kafka.appointment-phone-topic=${CATEDRA_KAFKA_APPOINTMENT_PHONE_TOPIC:}
# The consumer of the appointment actions defaults to PLAINTEXT, auto-offset-reset earliest and PT2M of retries;
# CATEDRA_KAFKA_SECURITY_PROTOCOL, CATEDRA_KAFKA_AUTO_OFFSET_RESET and CATEDRA_KAFKA_RETRY_MAX_ELAPSED_TIME override
# them, and CATEDRA_KAFKA_LISTENER_ENABLED=false leaves it stopped.

# Our own Servicio-catalogo.
# The timeouts default to PT2S (connect) and PT3S (read); CATALOGO_CONNECT_TIMEOUT and CATALOGO_READ_TIMEOUT
# override them (ISO-8601 duration).
catalogo.base-url=${CATALOGO_BASE_URL:}

# Time zone of the place of attention, used to leave out the slots that already started.
turnos.time-zone=${TURNOS_TIME_ZONE:America/Argentina/Buenos_Aires}

# JWT issued to the end users of the app (HS256). The secret must have at least 32 bytes.
# The lifetime defaults to PT24H; USER_JWT_EXPIRATION overrides it (ISO-8601 duration).
user.jwt.secret=${USER_JWT_SECRET:}
