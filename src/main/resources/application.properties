spring.application.name=servicio-turnos
spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Errors are returned as application/problem+json (RFC 9457).
spring.mvc.problemdetails.enabled=true

# Integration with the cátedra service. Real values only through environment variables (see .env.example).
# The empty default makes a missing variable fail validation at startup instead of binding the literal placeholder.
catedra.api-base-url=${CATEDRA_API_BASE_URL:}
catedra.jwt=${CATEDRA_JWT:}
catedra.kafka.bootstrap-servers=${CATEDRA_KAFKA_BOOTSTRAP_SERVERS:}
catedra.kafka.consumer-group-id=${CATEDRA_KAFKA_CONSUMER_GROUP_ID:}
catedra.kafka.appointment-actions-topic=${CATEDRA_KAFKA_APPOINTMENT_ACTIONS_TOPIC:}
catedra.kafka.appointment-phone-topic=${CATEDRA_KAFKA_APPOINTMENT_PHONE_TOPIC:}

# Our own Servicio-catalogo.
catalogo.base-url=${CATALOGO_BASE_URL:}
